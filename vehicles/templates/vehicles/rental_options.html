<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Rental Options — M-Motors</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'vehicles:vehicle_list' %}"
          >M-Motors</a
        >
        <a
          href="{% url 'vehicles:vehicle_list' %}"
          class="btn btn-outline-light btn-sm me-2"
          >Back to catalog</a
        >
      </div>
    </nav>

    <div class="container my-4">
      <h1 class="mb-4">Rental Options</h1>
      <p class="text-muted">
        Customize your long-term rental with optional services.
      </p>

      <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for option in options %}
        <div class="col">
          <div class="card h-100">
            <div class="card-body">
              <h4 class="card-title">{{ option.name }}</h4>
              <p class="card-text">{{ option.description }}</p>
            </div>
            <div
              class="card-footer d-flex justify-content-between align-items-center"
            >
              <span class="fs-4 fw-bold text-primary"
                >{{ option.monthly_price }} €<small class="text-muted fw-normal"
                  >/month</small
                ></span
              >
            </div>
          </div>
        </div>
        {% empty %}
        <p class="text-muted">No options available at the moment.</p>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
