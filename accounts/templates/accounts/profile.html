<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile — M-Motors</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'vehicles:vehicle_list' %}"
          >M-Motors</a
        >
        <div>
          <span class="text-light me-3">{{ user.first_name }}</span>
          <a
            href="{% url 'accounts:logout' %}"
            class="btn btn-outline-light btn-sm"
            >Log Out</a
          >
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <h1 class="mb-4">My Profile</h1>

          <div class="mb-3 p-3 bg-light rounded">
            <strong>Email :</strong> {{ user.email }} <br /><small
              class="text-muted"
              >The account's email cannot be modified.</small
            >
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-bold">First name</label>
              <input
                type="text"
                name="first_name"
                class="form-control"
                value="{{ user.first_name }}"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Last name</label>
              <input
                type="text"
                name="last_name"
                class="form-control"
                value="{{ user.last_name }}"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Phone</label>
              <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ user.phone }}"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Address</label>
              <textarea name="address" class="form-control" rows="2">
{{ user.address }}</textarea
              >
            </div>
            <button type="submit" class="btn btn-primary w-100">
              Save changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
